spring:
  datasource:
    url: jdbc:h2:mem:ticketdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: ticket
  flyway:
    enabled: true
    default-schema: ticket
    schemas: ticket
  rabbitmq:
    listener:
      simple:
        auto-startup: false
  security:
    oauth2:
      resourceserver:
        jwt:
          secret: test-secret-for-ticket-service

ticket:
  service-token: test-internal-token
  messaging:
    enabled: false
